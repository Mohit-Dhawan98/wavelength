[project]
name = "wavelength"
version = "0.1.0"
description = "Reference implementation of mutual-match (bidirectional) matchmaking."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mohit Dhawan", email = "mohit.dhawan2510@gmail.com" }]
dependencies = ["numpy>=2.0"]

[project.scripts]
wavelength = "wavelength.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wavelength"]

# The demo rules live at the repository root so they are easy to find and to
# add to; installed copies of the package carry them as wavelength/_rules.
[tool.hatch.build.targets.wheel.force-include]
"rules" = "wavelength/_rules"

[tool.pytest.ini_options]
testpaths = ["tests"]
