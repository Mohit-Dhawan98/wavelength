# Publishes the playground: builds the engine wheel, puts it beside the page, and deploys web/ to GitHub Pages.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "src/**"
      - "rules/**"
      - "pyproject.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Tests
        run: uv sync && uv run pytest -q

      - name: Build the engine into the page
        run: ./web/build_wheel.sh

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
